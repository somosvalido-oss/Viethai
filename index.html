<!doctype html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D48A0B'/%3E%3Cpath d='M64 34 34 64H50a14 14 0 0 0 14-14z' fill='%23C2334D'/%3E%3Cpath d='M32 14 42 32 32 50 22 32z' fill='%233D3A9E'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#FAF5EA;--card:#FFFDF8;--ink:#2B2219;--muted:#76675A;--line:#E7DBC4;--sunk:#F2EBDC;
  --th:#D48A0B;--th-ink:#7A4C00;--th-soft:#FBEBCB;
  --vn:#C2334D;--vn-ink:#8E1F35;--vn-soft:#F8DDE2;
  --gem:#3D3A9E;--gem-soft:#E4E3F7;
  --ok:#2F7D4F;--ok-soft:#DCEFE3;--warn:#A04A00;--warn-soft:#FDEBD7;--bad:#B42318;--bad-soft:#FBE0DD;
  --shadow:0 1px 2px rgba(60,40,10,.07),0 6px 18px rgba(60,40,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#16120E;--card:#211B15;--ink:#F1E8DA;--muted:#A99A86;--line:#3A3027;--sunk:#1B1611;
  --th:#F0A830;--th-ink:#FFD58A;--th-soft:#3A2A10;--vn:#EC6A83;--vn-ink:#FFB3C1;--vn-soft:#3F1A23;
  --gem:#9C9AF5;--gem-soft:#272551;--ok:#5CC285;--ok-soft:#173424;--warn:#F2A35E;--warn-soft:#3A2512;--bad:#FF7A6E;--bad-soft:#401B17;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}}
:root[data-theme=dark]{
  --paper:#16120E;--card:#211B15;--ink:#F1E8DA;--muted:#A99A86;--line:#3A3027;--sunk:#1B1611;
  --th:#F0A830;--th-ink:#FFD58A;--th-soft:#3A2A10;--vn:#EC6A83;--vn-ink:#FFB3C1;--vn-soft:#3F1A23;
  --gem:#9C9AF5;--gem-soft:#272551;--ok:#5CC285;--ok-soft:#173424;--warn:#F2A35E;--warn-soft:#3A2512;--bad:#FF7A6E;--bad-soft:#401B17;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0;line-height:1.2}
.th{--acc:var(--th);--acc-ink:var(--th-ink);--acc-soft:var(--th-soft)}
.vn{--acc:var(--vn);--acc-ink:var(--vn-ink);--acc-soft:var(--vn-soft)}
.nx{--acc:var(--muted);--acc-ink:var(--ink);--acc-soft:var(--sunk)}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.mast{flex:1;min-width:0}
.mast h1{font-size:19px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast h1 .ar{color:var(--th)} .mast h1 .ar2{color:var(--vn)}
.mast small{display:block;color:var(--muted);font-size:12px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
main{padding:12px 16px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;min-height:54px;font:600 10px/1.1 system-ui,sans-serif;border-radius:10px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink);background:var(--sunk)}
nav button.on svg{color:var(--th)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.acc{border-left:5px solid var(--acc)}
.hero{background:linear-gradient(135deg,var(--acc-soft),var(--card) 70%);border-left:5px solid var(--acc)}
.hero h2{font-size:28px;margin:2px 0 6px}
.kicker{font:700 11px/1.3 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink,var(--muted))}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px}
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.sec h3{font-size:18px;flex:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.stack>*+*{margin-top:8px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.verify{font-size:11.5px;color:var(--muted);font-style:italic}
.verify::before{content:"⚑ ";font-style:normal;color:var(--warn)}
.ex{display:inline-block;font:700 10px/1 system-ui;letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--sunk);color:var(--muted);border:1px dashed var(--muted);vertical-align:middle}

.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px;border-radius:10px}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.full{width:100%}
.btn:active,.chip:active,.tick:active{transform:scale(.97)}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px system-ui,sans-serif;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.th.on{background:var(--th);border-color:var(--th);color:#fff}
.chip.vn.on{background:var(--vn);border-color:var(--vn);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;color:var(--muted);font:600 13px system-ui,sans-serif;padding:0 6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.banner{border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.banner b{display:block}
.banner .ic{font-size:18px;line-height:1.2}
.b-warn{background:var(--warn-soft);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.b-bad{background:var(--bad-soft);border-color:var(--bad)}
.b-info{background:var(--gem-soft)}
.b-ok{background:var(--ok-soft)}

.leg{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.leg:first-child{border-top:0}
.leg .md{width:34px;height:34px;border-radius:10px;background:var(--acc-soft,var(--sunk));display:grid;place-items:center;font-size:18px;flex:none}
.leg .lt{flex:1;min-width:0}
.leg .lt b{font-weight:650}
.leg .meta{font-size:12.5px;color:var(--muted)}
.st{min-height:32px;padding:0 10px;border-radius:999px;font:700 11px system-ui;letter-spacing:.04em;text-transform:uppercase;border:1px solid;flex:none;background:none}
.st-tobook{color:var(--bad);border-color:var(--bad)}
.st-booked{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.st-paid{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.who{font:700 10.5px system-ui;padding:2px 6px;border-radius:6px;background:var(--gem-soft);color:var(--gem)}

.day{position:relative;padding-left:22px;margin-bottom:12px}
.day::before{content:"";position:absolute;left:7px;top:0;bottom:-12px;width:2px;background:var(--acc);opacity:.35}
.day::after{content:"";position:absolute;left:1px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--acc)}
.day.today::after{background:var(--acc)}
.day .card{margin:0}
.dhead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.dhead h4{font-size:17px;flex:1}
.place{font:700 15px var(--serif);color:var(--acc-ink);text-decoration:none;border-bottom:1px dotted var(--acc)}
.acc-box{background:var(--sunk);border-radius:12px;padding:10px;margin:8px 0;font-size:13.5px}
.acc-box .k{color:var(--muted);font-size:12px}
textarea,input,select{font:15px system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0}
label.f{display:block;margin:0 0 10px;font-size:12.5px;color:var(--muted);font-weight:600}
label.f>input,label.f>select,label.f>textarea{margin-top:4px}
.cks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--ink);font-size:14px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

.idea{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.idea:first-of-type{border-top:0}
.idea .tx{flex:1;min-width:0}
.idea h5{margin:0;font:700 15px var(--serif)}
.idea.isdone h5{text-decoration:line-through;opacity:.6}
.gemmark{color:var(--gem)}
.gemhead{color:var(--gem)}
.tick{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--muted);font-size:18px}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.want.on{background:var(--th);border-color:var(--th)}
.vote{min-height:32px;min-width:36px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:700 12px system-ui;color:var(--muted)}
.vote.on{background:var(--gem-soft);color:var(--gem);border-color:var(--gem)}

.ci{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.ci .tx{flex:1;font-size:14.5px}
.ci.on .tx{color:var(--muted);text-decoration:line-through}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.over i{background:var(--bad)}
.bar.th i{background:var(--th)} .bar.vn i{background:var(--vn)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.big{font:700 34px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.cd{font:700 22px/1.2 var(--serif);font-variant-numeric:tabular-nums;color:var(--acc-ink,var(--ink))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tel{font-weight:700;text-decoration:none;border-bottom:1px dotted}
.ph td:first-child{font-weight:600}
.ph .scr{font-size:16px}
.ph .pr{color:var(--muted);font-size:12.5px;font-style:italic}

.sheet-bg{position:fixed;inset:0;background:rgba(20,12,4,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:20px;margin-bottom:12px}
.sheet .actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--paper);padding:10px 0 4px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:8px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;font-size:14px;max-width:90vw;box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:16px;font-size:14px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.datebar input{width:auto;min-height:38px;padding:6px 8px}
.bigphrase{font:700 40px/1.2 var(--serif);text-align:center;margin:20px 0 8px;word-break:break-word}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.exp{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.exp:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none;margin-top:6px}
@media (min-width:600px){nav button{font-size:11px}}
</style>
</head>
<body>
<header>
  <div class="mast">
    <h1>Andaman <span class="ar">→</span> Hanoi <span class="ar2">’27</span></h1>
    <small id="hsub">Thailand · Vietnam · Thailand</small>
  </div>
  <button class="iconbtn" data-a="settings" aria-label="Sync, export and settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
  </button>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheetRoot"></div>

<script>
'use strict';
/* =========================================================
   Andaman to Hanoi 2027 — offline trip companion
   All data lives in localStorage (key a2h27). Times are local
   Thailand/Vietnam time (both UTC+7).
   ========================================================= */
const START='2027-01-29', END='2027-02-20', TZ='+07:00';
const SEEDV=2; // bump when seed data changes; unedited seed records are upgraded in place
const LS='a2h27', LSL='a2h27-local';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const uid=p=>p+'_'+Math.random().toString(36).slice(2,8)+now().toString(36).slice(-4);
const D=s=>new Date(s+'T00:00:00Z');
const addDays=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmtDay=(s,o={weekday:'short',day:'numeric',month:'short'})=>D(s).toLocaleDateString('en-GB',{...o,timeZone:'UTC'});
const ictNow=()=>new Date(now()+7*3600e3);
const realToday=()=>ictNow().toISOString().slice(0,10);
const abs=(d,t)=>Date.parse(d+'T'+(t||'00:00')+':00'+TZ);
const days=[];for(let d=START;d<=END;d=addDays(d,1))days.push(d);
const dayNo=d=>Math.round((D(d)-D(START))/864e5)+1;

/* ---------------- Static reference ---------------- */
const PLACES={
  bkk:{n:'Bangkok',c:'TH',w:'Hot and mostly dry, ≈ 25–33 °C. Do temples early, rooftops after dark.'},
  lanta:{n:'Koh Lanta',c:'TH',island:1,w:'Peak dry season: sunny, ≈ 24–32 °C, calm Andaman Sea, water ≈ 28 °C — good dive visibility.'},
  mook:{n:'Koh Mook / Koh Kradan',c:'TH',island:1,w:'Dry season: sunny, ≈ 24–32 °C, flat seas. Check tide times for the Emerald Cave.'},
  ngai:{n:'Koh Ngai',c:'TH',island:1,w:'Dry season: sunny, ≈ 24–32 °C, calm, clear water off the beach.'},
  phiphi:{n:'Koh Phi Phi',c:'TH',island:1,w:'Dry season: sunny, ≈ 25–32 °C. Busy — boats are best before 09:00.'},
  railay:{n:'Railay',c:'TH',island:1,w:'Dry season: sunny, ≈ 25–33 °C. Boat-only access, tides affect landing.'},
  yaonoi:{n:'Koh Yao Noi',c:'TH',island:1,w:'Dry season: sunny, ≈ 24–32 °C, calm Phang Nga Bay.'},
  sgn:{n:'Ho Chi Minh City',c:'VN',w:'Dry season: hot, ≈ 23–33 °C, rain unlikely. Tết crowds in the evenings.'},
  hoian:{n:'Hoi An / Da Nang',c:'VN',w:'Tail of the rainy season: ≈ 20–26 °C, some showers, sea can be choppy.'},
  hanoi:{n:'Hanoi',c:'VN',w:'Cool and grey: ≈ 14–19 °C with drizzle. Warm layer + rain jacket.'}
};
const MODES={flight:'✈️',ferry:'⛴️',speedboat:'🚤',longtail:'🛶',van:'🚐',taxi:'🚕',train:'🚆',bus:'🚌',walk:'🚶',other:'•'};
const STATUS=['to book','booked','paid'];
const CURS=['THB','VND','EUR'];
const GROUPS=[
  {k:'now',n:'Now',due:'2026-12-15'},
  {k:'w6',n:'4–6 weeks before',due:'2027-01-01'},
  {k:'w3',n:'2–3 weeks before',due:'2027-01-15'},
  {k:'last',n:'Last days',due:'2027-01-28'},
  {k:'pack',n:'Packing',due:'2027-01-28'}];
const DIVE_ITEMS=[['el','eLearning finished'],['med','Medical questionnaire (doctor’s signature if any “yes”)'],['ins','Dive insurance'],['log','Logbook']];
const CATS=['Accommodation','Transport','Long-haul flights','Diving','Food & drink','Tours & activities','Shopping & suits','Other'];

/* ---------------- Seed data ---------------- */
function seed(){
  const S={schema:1,seedV:SEEDV,travellers:[],stops:[],legs:[],ideas:[],dives:[],expenses:[],items:[],budget:[],checks:{},notes:{},blobs:{},del:{}};
  const ALL=['A','B'];
  S.travellers=[
    {id:'t_a',o:1,name:'Alessandro',from:START,to:END,diver:'yes',u:SEEDV},
    {id:'t_k',o:2,name:'Kris',from:START,to:END,diver:'yes',u:SEEDV},
    {id:'t_d',o:4,name:'Daniel',from:'2027-02-03',to:END,diver:'no',u:SEEDV}];
  const st=(id,place,from,to,routes,notes,lastBoat='')=>S.stops.push({id,place,name:PLACES[place].n,from,to,routes,notes,lastBoat,acc:'',addr:'',ref:'',checkin:'',phone:'',status:'to book',u:SEEDV});
  st('s_bkk1','bkk','2027-01-29','2027-01-30',ALL,'Arrival, rest, sleep off jet lag. Stay near the airport rail link or the river for an easy 30 Jan departure.');
  st('s_lanta','lanta','2027-01-30','2027-02-03',ALL,'Stay near Saladan / Long Beach (Phra Ae) — Phoenix Divers is in Saladan.','Island-hopping speedboats mostly leave in the morning; book the day before.');
  st('s_mook','mook','2027-02-03','2027-02-05',['A'],'Daniel joins today. Stay on Mook (Charlie Beach) or across on Kradan.','Longtails to Kuantungku pier until ≈ 16:00–17:00.');

/* Replace seed records nobody has edited (u is a small seed number, not a timestamp) with the current seed. */
function upgradeSeed(X){
  const n=seed(),isSeed=o=>(o?.u||0)<1e6;
  for(const c of COLS){const ids=new Set(n[c].map(x=>x.id));
    X[c]=(X[c]||[]).filter(x=>{if(!ids.has(x.id)&&isSeed(x)){X.del[x.id]=Math.max(X.del[x.id]||0,SEEDV);return false}return true});
    for(const x of n[c]){const i=X[c].findIndex(y=>y.id===x.id);if(i<0)X[c].push(x);else if(isSeed(X[c][i]))X[c][i]=x}}
  for(const mp of MAPS)for(const k in n[mp])if(!X[mp][k]||isSeed(X[mp][k]))X[mp][k]=n[mp][k];
  X.seedV=SEEDV;
}

/* ---------------- Merge (sync) ---------------- */
function merge(a,b){
  const out=JSON.parse(JSON.stringify(a));const del={...(a.del||{})};
  for(const k in b.del||{})del[k]=Math.max(del[k]||0,b.del[k]);
  for(const c of COLS){const m=new Map();(a[c]||[]).forEach(x=>m.set(x.id,x));
    (b[c]||[]).forEach(x=>{const y=m.get(x.id);if(!y||(x.u||0)>(y.u||0))m.set(x.id,x)});
    out[c]=[...m.values()].filter(x=>!(del[x.id]>=(x.u||0)))}
  for(const mp of MAPS){out[mp]={...(a[mp]||{})};for(const k in b[mp]||{}){const y=out[mp][k];if(!y||(b[mp][k].u||0)>(y.u||0))out[mp][k]=b[mp][k]}}
  out.del=del;out.seedV=Math.max(a.seedV||1,b.seedV||1);return out;
}

/* fields: {k,l,t:text|number|date|time|select|textarea|checks,o:[[v,label]],half} */
function openForm(title,fields,vals,onSave,onDelete,extra=''){
  const f=fields.map(fd=>{const v=vals[fd.k]??'';const lab=`<span>${esc(fd.l)}</span>`;
    if(fd.t==='select')return `<label class="f">${lab}<select name="${fd.k}">${fd.o.map(([ov,ol])=>`<option value="${esc(ov)}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`).join('')}</select></label>`;
    if(fd.t==='textarea')return `<label class="f">${lab}<textarea name="${fd.k}" placeholder="${esc(fd.ph||'')}">${esc(v)}</textarea></label>`;
    if(fd.t==='checks'){const arr=Array.isArray(v)?v:[];return `<div class="f"><label class="f" style="margin:0">${lab}</label><div class="cks">${fd.o.map(([ov,ol])=>`<label><input type="checkbox" name="${fd.k}" value="${esc(ov)}"${arr.includes(ov)?' checked':''}>${esc(ol)}</label>`).join('')}</div>${fd.hint?`<div class="xs muted" style="margin:4px 0 10px">${esc(fd.hint)}</div>`:'<div style="height:10px"></div>'}</div>`}
    return `<label class="f">${lab}<input name="${fd.k}" type="${fd.t||'text'}" ${fd.t==='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(fd.ph||'')}"></label>`});
  // pair "half" fields into grids
  let body='',i=0;while(i<fields.length){if(fields[i].half&&fields[i+1]?.half){body+=`<div class="grid2">${f[i]}${f[i+1]}</div>`;i+=2}else{body+=f[i];i++}}
  sheet(`<h3>${esc(title)}</h3>${extra}<form id="frm" autocomplete="off">${body}<div class="actions">${onDelete?'<button type="button" class="btn danger" data-a="fdel">Delete</button>':''}<span class="grow"></span><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Save</button></div></form>`);
  formCb={fields,onSave,onDelete};
}
function readForm(){const fm=$('#frm');const out={};for(const fd of formCb.fields){
  if(fd.t==='checks')out[fd.k]=[...fm.querySelectorAll(`input[name="${fd.k}"]:checked`)].map(x=>x.value);
  else{const el=fm.elements[fd.k];out[fd.k]=fd.t==='number'?(el.value===''?'':+el.value):el.value.trim()}}return out}

function earliestFly(){const nf=B('nofly');if(!nf?.last)return null;const h=(+nf.days>1||nf.multi)?18:12;return {t:Date.parse(nf.last+':00'+TZ)+h*3600e3,h}}
function flightConflicts(){const e=earliestFly();if(!e)return[];const last=Date.parse(B('nofly').last+':00'+TZ);

  return legs().filter(l=>l.mode==='flight'&&l.dep&&(!l.who.length||l.who.some(id=>dv.includes(id)))&&abs(l.date,l.dep)>last&&abs(l.date,l.dep)<e.t)}
function fmtDT(ms){const d=new Date(ms+7*3600e3);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})+' '+d.toISOString().slice(11,16)}
function nowRef(){if(!L.date)return now();return abs(L.date,ictNow().toISOString().slice(11,16))}

function warnings(d){
  const w=[];const s=dayStop(d);const c=ctry(s);const r=route();
  if(d>='2027-01-26'&&d<='2027-01-29')w.push(['warn','🛂','Thailand Digital Arrival Card','Submit the TDAC within 3 days before arrival (29 Jan).']);
  if(d>='2027-02-14'&&d<='2027-02-17')w.push(['warn','🛂','TDAC for re-entry','Submit a new TDAC before the 17 Feb flight to Bangkok.']);
  if(d>='2027-02-04'&&d<='2027-02-10'&&(c==='VN'||d==='2027-02-08'))w.push(['bad','🏮','Tết holiday in Vietnam (4–10 Feb)','Many restaurants, shops and museums closed or on short hours. Carry cash; pre-book Grab.']);
  if(d==='2027-02-06')w.push(['info','🧧','Lunar New Year today','Chinese New Year in Thailand too — islands and boats are at their busiest.']);
  if(d==='2027-02-10')w.push(['bad','🚌','Packed transport today','End of Tết — airports and roads jammed. Arrive at SGN 2.5 h early.']);
  if(d==='2027-02-10'||d==='2027-02-11')w.push(['warn','✂️','Hoi An tailors reopening','Tailors reopen ≈ 10–11 Feb. Order on day 1 to fit three fittings in before 14 Feb.']);
  if(d==='2027-02-03')w.push(['warn','🧑‍✈️','Daniel joins today',r==='A'?'Early flight BKK → Trang, taxi to Kuantungku, longtail to Mook — last longtails ≈ 16:00–17:00.':'Early flight BKK → Phuket, ferry from Rassada to Phi Phi.']);
  if(d>='2027-01-31'&&d<='2027-02-03')w.push(['info','🤿','Diving: no-fly rule','Wait 12 h after a single dive, 18 h after multi-day diving. First flight is 8 Feb — fine.']);
  if(PLACES[s?.place]?.island&&s.lastBoat&&(legs().some(l=>l.date===d&&l.mode!=='flight')||nightStop(addDays(d,1))?.id!==s.id))w.push(['warn','⛴️','Last boats',s.lastBoat+' (verify locally)']);
  const conf=flightConflicts().filter(l=>l.date===d||l.date===addDays(d,1));
  conf.forEach(l=>w.push(['bad','⛔','No-fly conflict',`${l.from} → ${l.to} at ${l.dep} is before your earliest safe flight (${fmtDT(earliestFly().t)}).`]));
  if(d===END)w.push(['warn','✈️','Flight home','Confirm the date and time of the long-haul home.']);
  return w;
}

/* money */
function balances(){const bal={};S.travellers.forEach(t=>bal[t.id]=0);const share={};S.travellers.forEach(t=>share[t.id]={});
  for(const e of S.expenses){const eur=toEur(e.amt,e.cur);const sp=e.split?.length?e.split:[e.paid];bal[e.paid]=(bal[e.paid]||0)+eur;
    sp.forEach(id=>{bal[id]=(bal[id]||0)-eur/sp.length;share[id]=share[id]||{};share[id][e.cat]=(share[id][e.cat]||0)+eur/sp.length})}
  return {bal,share}}
function settle(){const {bal}=balances();const cr=[],db=[];
  for(const id in bal){const v=Math.round(bal[id]*100)/100;if(v>0.004)cr.push([id,v]);else if(v<-0.004)db.push([id,-v])}
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);const tr=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const x=Math.min(db[i][1],cr[j][1]);if(x>0.004)tr.push([db[i][0],cr[j][0],x]);db[i][1]-=x;cr[j][1]-=x;if(db[i][1]<0.005)i++;if(cr[j][1]<0.005)j++}
  return tr}
function settleText(){const tr=settle();return 'Andaman → Hanoi — settle up (EUR)\n'+(tr.length?tr.map(([a,b,x])=>`${tn(a)} → ${tn(b)}: ${fmt(x)}`).join('\n'):'Everyone is square.')+`\nRates: 1 € = ${B('rates').THB} THB = ${B('rates').VND} VND`}

function exportJSON(){return JSON.stringify({...S,exportedAt:new Date().toISOString()})}
function exportFile(){const name=`andaman-hanoi-${new Date().toISOString().slice(0,10)}-${(tn(L.viewAs)||'').toLowerCase()}.json`;return new File([exportJSON()],name,{type:'application/json'})}
function stageImport(txt){
  let o;try{o=JSON.parse(txt)}catch(e){$('#impBox').innerHTML=banner(['bad','⚠️','Not valid JSON','Copy the whole text, from { to }.']);return}
  if(!o||o.schema!==1||!Array.isArray(o.legs)){$('#impBox').innerHTML=banner(['bad','⚠️','Not an Andaman → Hanoi export','']);return}
  pendingImport=o;
  $('#impBox').innerHTML=`<div class="banner b-info"><span class="ic">📥</span><div><b>Ready to import</b>${o.expenses.length} expenses, ${o.dives.length} dives${o.exportedAt?' · exported '+esc(new Date(o.exportedAt).toLocaleString('en-GB')):''}</div></div><div class="row"><button class="btn pri" data-a="impMerge">Merge (recommended)</button><button class="btn danger" data-a="impReplace">Replace everything</button></div>`;
}

/* ---------------- Text exports ---------------- */
function textFor(k){
  if(k==='settle')return settleText();
  if(k==='itin'){let t=`ANDAMAN → HANOI 2027 · Route ${route()}\n`;for(const d of days){const s=dayStop(d),st=stops().find(x=>x.from===d);t+=`\n${fmtDay(d)} — ${s.name}`;if(st)t+=` (${Math.round((D(st.to)-D(st.from))/864e5)} n${st.acc?', '+st.acc:''}${st.ref?', ref '+st.ref:''} [${st.status||'to book'}])`;
    legs().filter(l=>l.date===d||(d===START&&l.date<START)).forEach(l=>t+=`\n  ${MODES[l.mode]||'•'} ${l.from} → ${l.to}${l.dep?' '+l.dep:''}${l.operator?' · '+l.operator:''} [${l.status}]${l.who.length&&l.who.length<S.travellers.length?' ('+l.who.map(tn).join(', ')+')':''}`);if(note(d))t+=`\n  ✎ ${note(d)}`}return t+'\n\n(times/prices: verify before travel)'}
  if(k==='today'){const d=curDate();if(d<START||d>END)return `Andaman → Hanoi: ${Math.round((D(START)-D(d))/864e5)} days to go!`;const s=dayStop(d),ns=nightStop(d);let t=`${fmtDay(d)} · Day ${dayNo(d)} · ${s.name}\nTonight: ${ns?(ns.acc||ns.name)+(ns.addr?', '+ns.addr:''):'fly home'}`;
    legs().filter(l=>l.date===d).forEach(l=>t+=`\n${MODES[l.mode]||'•'} ${l.from} → ${l.to} ${l.dep||''} [${l.status}]`);if(note(d))t+='\n'+note(d);warnings(d).forEach(w=>t+=`\n${w[1]} ${w[2]}`);return t}
  if(k==='budget'){const {share}=balances();let t='Budget — spent per person (EUR)\n';T().forEach(p=>{const tot=Object.values(share[p.id]||{}).reduce((a,b)=>a+b,0);t+=`${p.name}: ${fmt(tot)}\n`});return t}
  if(k==='lists'){const me=L.viewAs;let t=`Open items — ${tn(me)}\n`;GROUPS.forEach(g=>{const it=S.items.filter(i=>i.group===g.k&&(!i.only.length||i.only.includes(me))&&!C(i.id+':'+me));if(it.length)t+=`\n${g.n}:\n`+it.map(i=>'☐ '+i.text).join('\n')+'\n'});return t}
  return '';
}

/* ---------------- Render ---------------- */
const VIEWS={today:vToday,trip:vTrip,places:vPlaces,dive:vDive,money:vMoney,lists:vLists,info:vInfo};
function render(){
  const r=document.documentElement;if(L.theme&&L.theme!=='auto')r.dataset.theme=L.theme;else r.removeAttribute('data-theme');
  const d=curDate();
  $('#hsub').textContent=d>=START&&d<=END?`Day ${dayNo(d)} · ${dayStop(d).name} · Route ${route()}`:`29 Jan – 20 Feb 2027 · Route ${route()}`;
  $('#main').innerHTML=VIEWS[L.tab]();
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${L.tab===k?'on':''}" data-a="tab" data-v="${k}" aria-current="${L.tab===k?'page':'false'}">${IC[k]}<span>${l}</span></button>`).join('');
}

  resetNo:()=>{$('#resetBox').innerHTML=''},
  resetYes:()=>{S=seed();persist();closeSheet();render();toast('Reset to defaults')},
  editTrav:(v,id)=>{const t=byId('travellers',id);openForm('Traveller',[{k:'name',l:'Name'},{k:'from',l:'On the trip from',t:'date',half:1},{k:'to',l:'until',t:'date',half:1},{k:'diver',l:'Doing the PADI course',t:'select',o:[['yes','Yes'],['no','No']]}],t,x=>{if(!x.name)return;upsert('travellers',{...t,...x})})},
  phrase:(v,id,t)=>{const p=PHRASES[v];sheet(`<div class="kicker" style="text-align:center">${esc(p[0])}</div><div class="bigphrase">${esc(t==='th'?p[1]:p[3])}</div><p style="text-align:center;font-size:20px" class="muted"><i>${esc(t==='th'?p[2]:p[4])}</i></p><div class="actions"><button class="btn full pri" data-a="close">Close</button></div>`)},
  close:()=>closeSheet(),
  fdel:(v,id,t,el)=>{if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent='Tap again to delete';return}formCb.onDelete();closeSheet();save()}
};
function load2(){for(const c of COLS)S[c]=S[c]||[];for(const m of MAPS)S[m]=S[m]||{};S.del=S.del||{}}

document.addEventListener('click',e=>{
  if(e.target.matches('[data-bg]')){closeSheet();return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;if(!ACT[a])return;
  e.preventDefault();
  ACT[a](el.dataset.v,el.dataset.id,el.dataset.t,el);
});
document.addEventListener('submit',e=>{if(e.target.id!=='frm'||!formCb)return;e.preventDefault();const r=formCb.onSave(readForm());if(r===false)return;closeSheet();save()});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='dpick'){L.date=el.value&&el.value!==realToday()?el.value:'';saveL();render();return}
  if(el.id==='impFile'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>stageImport(r.result);r.readAsText(f);return}
  const c=el.dataset.c;if(!c)return;
  if(c==='note'){S.notes[el.dataset.v]={v:el.value,u:now()};persist();return}
  if(c==='rate'){const r={...B('rates')};r[el.dataset.k]=el.dataset.k==='updated'?el.value:(+el.value||r[el.dataset.k]);setB('rates',r);save();return}
  if(c==='nofly'){const n={...B('nofly')};const k=el.dataset.k;n[k]=k==='multi'?el.checked:k==='days'?Math.max(1,+el.value||1):el.value;setB('nofly',n);save();return}
  if(c==='info'){const i={...(B('info')||{})};i[el.dataset.k]=el.value;setB('info',i);persist();toast('Saved');return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='impText'){const t=e.target.value.trim();if(t.length>20)stageImport(t);return}
  if(e.target.dataset.i==='conv'){L.cAmt=e.target.value;saveL();const c=L.cCur||'THB';$('#cout').innerHTML=convOut(toEur(e.target.value,c),c)}
});
setInterval(()=>{document.querySelectorAll('[data-cd]').forEach(el=>el.textContent=cdText(+el.dataset.cd-nowRef()))},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('.sheet')&&!document.activeElement?.matches('input,textarea'))render()});

load();render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
